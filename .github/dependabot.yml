version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Helsinki"
    target-branch: "develop"
    open-pull-requests-limit: 10
    groups:
      # One PR for all minor and patch bumps; majors still get their own PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        # Django feature releases (5.1 -> 5.2) count as "minor" but can break
        # things; channels is tied to Django. Review these as separate PRs.
        exclude-patterns:
          - "django"
          - "channels"
    ignore:
      # Major upgrades of these are planned work, not drive-by bumps
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "channels"
        update-types: ["version-update:semver-major"]
      # Auth stack majors can change login behaviour (e.g. social-auth-core 6
      # changed how stored identities are matched).
      - dependency-name: "social-auth-app-django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-helusers"
        update-types: ["version-update:semver-major"]
      # 3.20 removes the list error format kept by
      # LIST_SERIALIZER_ERRORS_AS_DICT in project/settings.py.
      - dependency-name: "djangorestframework"
        versions: [">=3.20"]
      # 5.x removes EventsConsumer, which project/consumers.py subclasses.
      - dependency-name: "django-eventstream"
        versions: [">=5"]
